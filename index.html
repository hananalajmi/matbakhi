async function rpc(fn,body){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),20000);

  let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error('http'+r.status),{http:r.status,body:j});return j}

/* ---------- تطبيق سجل قادم من الخادم ---------- */
function removeRecipeLocal(id){S.recipes=S.recipes.filter(r=>String(r.id)!==String(id));if(S.fav)delete S.fav[id]}
function setLocal(key,d){const kd=key.split(':')[0],id=key.slice(kd.length+1);
 if(kd==='recipe'){const nr=clone(d);nr.id=id;nr.tools=nr.tools||'';nr.steps=nr.steps||'';if(typeof RC!=='undefined'&&!RC.includes(nr.cat))nr.cat=RC[0];
  const i=S.recipes.findIndex(r=>String(r.id)===id);if(i>=0){Object.assign(nr,mediaOf(S.recipes[i]));S.recipes[i]=nr}else S.recipes.push(nr)}
 else if(kd==='week'){S.weeks[id]=normW(clone(d))}
 else if(kd==='meta'){const c=canon(key,d);S.names=S.names||{};if(c.names.site)S.names.site=c.names.site;if(c.names.plan)S.names.plan=c.names.plan;S.en=Object.assign({},S.en||{},c.en)}}
function applyRow(row,L){const key=row.kind+':'+row.id,kd=row.kind;if(!['recipe','week','meta'].includes(kd))return 0;const mk=meta.keys[key];
 if(kd==='recipe'&&row.deleted)meta.bin[key]={name:(row.data&&row.data.name)||'وصفة',cat:(row.data&&row.data.cat)||'',data:row.data,v:row.version,at:Date.parse(row.updated_at)||Date.now()};
 else if(meta.bin[key])delete meta.bin[key];
 if(mk&&mk.v>=row.version&&mk.v>0)return 0;
 if(!row.deleted&&!valid(key,row.data))return 0;
 const loc=L[key],rc=row.deleted?null:canon(key,row.data),rh=rc?hash(rc):'';
 if(loc&&!row.deleted&&hash(loc)===rh){meta.keys[key]={v:row.version,h:rh,del:false};return 0}
 const dirty=loc&&(!mk||hash(loc)!==mk.h);
 if(dirty){if(kd==='meta'){meta.keys[key]={v:row.version,h:rh,del:false};setLocal(key,row.data);return 1}return 0}
 if(row.deleted){if(kd==='recipe')removeRecipeLocal(row.id);else if(kd==='week'){/* لا نحذف الأسابيع */}meta.keys[key]={v:row.version,h:mk?mk.h:'',del:true};return 1}
 setLocal(key,row.data);meta.keys[key]={v:row.version,h:rh,del:false};return 1}

/* ---------- جلب ---------- */
function isUntouched(){try{const a=hash(Object.assign({},...Object.entries(recs()).filter(([k])=>k.indexOf('meta:')!==0).map(([k,v])=>({[k]:v}))));const sd=seed();const sr={};sd.recipes.forEach(r=>sr['recipe:'+r.id]=canon('recipe:'+r.id,r));for(const k in sd.weeks)if(!emptyW(sd.weeks[k]))sr['week:'+k]=canon('week:'+k,sd.weeks[k]);return a===hash(sr)}catch(e){return false}}
async function pull(){const res=await rpc('mk_pull',{p_code:meta.code,p_since:meta.since});
 if(!res||!res.ok){if(res&&res.error==='bad_code'){const e=new Error('bad_code');e.bad=1;throw e}throw new Error('pull')}
 const rows=res.rows||[];let ch=0;
 if(meta.first){const live=rows.filter(r=>!r.deleted&&['recipe','week'].includes(r.kind)).length;const un=isUntouched();
  if(live>0&&un){S.recipes=[];S.weeks={}}
  else if(live>0&&!un){if(!confirm('في القاعدة المشتركة '+live+' عنصرًا (وصفات وأسابيع).\nسيُدمج ما على هذا الجهاز معها ولا يُحذف شيء.\nإن اختلفت وصفة بنفس الرقم تُحفظ نسختك في قائمة «التعارضات».\n\nمتابعة؟')){meta.code='';saveMeta();const e=new Error('cancel');e.cancel=1;throw e}}
  else if(live===0&&un){const L0=recs();for(const k in L0)meta.keys[k]={v:0,h:hash(L0[k]),del:false}}}
 const L=recs();rows.forEach(r=>{ch+=applyRow(r,L)});
 meta.first=false;
 if(res.now){const t=Date.parse(res.now);if(t)meta.since=new Date(t-5000).toISOString()}
 saveMeta();if(ch){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}needRender=true}return ch}

/* ---------- رفع ---------- */
async function pushOne(key,data,base,tries){const kd=key.split(':')[0],id=key.slice(kd.length+1);
 const r=await rpc('mk_push',{p_code:meta.code,p_kind:kd,p_id:id,p_data:data,p_base:base});
 if(r.ok){meta.keys[key]={v:r.version,h:hash(data),del:false};return 'ok'}
 if(r.error==='bad_code'){const e=new Error('bad_code');e.bad=1;throw e}
 if(r.error==='too_large')return 'big';
 if(r.error==='conflict'){const sv=r.server||{};
  if(sv.deleted&&kd==='recipe'&&tries<1)return pushOne(key,data,sv.version,tries+1);
  if(kd==='meta'){const m=canon(key,sv.data||{});const merged={names:Object.assign({},canon(key,data).names,m.names),en:Object.assign({},canon(key,data).en,m.en)};setLocal(key,merged);meta.keys[key]={v:sv.version,h:hash(canon(key,sv.data||{})),del:false};return 'merged'}
  meta.conf.unshift({key,name:nm(key,data),local:data,at:Date.now()});meta.conf=meta.conf.slice(0,30);
  if(sv.deleted){if(kd==='recipe')removeRecipeLocal(id);meta.keys[key]={v:sv.version,h:'',del:true}}
  else{setLocal(key,sv.data);meta.keys[key]={v:sv.version,h:hash(canon(key,sv.data)),del:false}}
  needRender=true;return 'conf'}
 throw new Error('push')}
async function push(){const L=recs();let n=0,big=0,conf=0;
 for(const key in L){const mk=meta.keys[key],h=hash(L[key]);if(mk&&mk.h===h&&!mk.del)continue;
  if(mk&&mk.del&&!mk.h&&key.indexOf('recipe:')!==0)continue;
  const r=await pushOne(key,L[key],mk?mk.v:0,0);if(r==='ok')n++;else if(r==='big')big++;else if(r==='conf'||r==='merged')conf++}
 const gone=Object.keys(meta.keys).filter(k=>k.indexOf('recipe:')===0&&!meta.keys[k].del&&!(k in L));
 if(gone.length){let go=true;const real=gone.filter(k=>meta.keys[k].v>0);
  if(real.length>=3)go=confirm('سيُحذف '+real.length+' وصفات من القاعدة المشتركة لأنها غير موجودة على هذا الجهاز.\nتبقى نسخها في «سلة العائلة» ويمكن استرجاعها.\n\nمتابعة؟');
  for(const k of gone){const mk=meta.keys[k];if(!go||mk.v===0){if(mk.v===0)delete meta.keys[k];continue}
   const kd='recipe',id=k.slice(7);const r=await rpc('mk_delete',{p_code:meta.code,p_kind:kd,p_id:id});
   if(r.ok){meta.keys[k]={v:r.version,h:mk.h,del:true};n++}else if(r.error==='not_found')delete meta.keys[k];else if(r.error==='bad_code'){const e=new Error('bad_code');e.bad=1;throw e}}}
 saveMeta();return{n,big,conf}}

async function sync(manual){if(!meta.code)return;if(busy){again=true;return}

 try{await pull();let r=await push();if(r.conf){await push()}
  fails=0;meta.last=Date.now();saveMeta();
  setState(meta.conf.length?'warn':'ok',r.big?'وصفة كبيرة جدًا لم تُرفع (الحد 1MB)':'');}
 catch(e){if(e&&e.bad){setState('badcode','الكود غير صحيح أو تغيّر. أدخلي الكود الجديد.');}

  else{fails++;setState('offline',navigator.onLine===false?'لا يوجد اتصال — التعديلات محفوظة على الجهاز وسترفع لاحقًا':'تعذّر الاتصال بالخادم — ستُعاد المحاولة تلقائيًا')}}
 finally{busy=false;if(again){again=false;setTimeout(()=>sync(),300)}}
 trySafeRender()}

const URLS={},rx=/\/_blob\/([0-9a-f]{32})$/;
async function objUrl(id){if(URLS[id])return URLS[id];const b=await get('media',id);return b?(URLS[id]=URL.createObjectURL(b)):null}
async function hyd(el){for(const a of['src','poster']){const v=el.getAttribute(a),m=v&&v.match(rx);if(m){try{const u=await objUrl(m[1]);if(u)el.setAttribute(a,u)}catch(e){}}}}
const SEL='[src^="/_blob/"],[poster^="/_blob/"]',scan=n=>{if(n.nodeType!==1)return;if(n.matches(SEL))hyd(n);n.querySelectorAll(SEL).forEach(hyd)};
new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(scan);if(m.type==='attributes')scan(m.target)})).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src','poster']});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{try{await restore()}catch(e){}const s=document.createElement('script');s.textContent=document.getElementById('appcode').textContent;document.body.appendChild(s);const s2=document.createElement('script');s2.textContent=document.getElementById('synccode').textContent;document.body.appendChild(s2)})();
})();
